# Ereignisse und ihre Felder (JSON)
#   game_started   players
#   score          player, category, value, served, column, total, totals, leader
#   grande         player, value, served, total, totals
#   leader_changed leader, total, totals
#   game_finished  winner, total, totals
#   trophy         player, trophy, tier (b/s/g/p), tier_name
#   level_up       player, level, rank
#   test           message
